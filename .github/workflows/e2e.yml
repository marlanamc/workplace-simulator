name: E2E

on:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    # Deliberately NOT secrets.DATABASE_URL. This job applies the schema before
    # it runs tests, and `drizzle-kit push` will drop columns the schema no
    # longer declares — so it must never be able to reach the live database.
    # A separate secret makes pointing it at production a deliberate act rather
    # than an accident.
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Two guards, because the next step mutates whatever it is pointed at.
      - name: Check this points at a throwaway database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::E2E_DATABASE_URL is not set. Create a throwaway Neon branch"
            echo "::error::with a database named so the URL ends in e2e or test, then add"
            echo "::error::it as the E2E_DATABASE_URL repository secret. See TESTING.md."
            exit 1
          fi
          # Strip any ?params, then read the database name after the last "/".
          db_name="${DATABASE_URL%%\?*}"
          db_name="${db_name##*/}"
          case "$db_name" in
            *e2e*|*E2E*|*test*|*TEST*)
              echo "Target database: $db_name" ;;
            *)
              echo "::error::Refusing to run: the database is named '$db_name', which does"
              echo "::error::not look like a test database. This step applies schema changes"
              echo "::error::and can drop columns. Name the e2e database so it contains 'e2e'"
              echo "::error::or 'test' (see TESTING.md), or fix E2E_DATABASE_URL."
              exit 1 ;;
          esac
          if [ -z "$SESSION_SECRET" ]; then
            echo "::error::E2E_SESSION_SECRET is not set. Sign-in throws without it and"
            echo "::error::every test fails at the login screen. See TESTING.md."
            exit 1
          fi

      # Rows left behind by previous runs. Every test signs up its own
      # throwaway learner, so none of it is worth keeping — and accumulated
      # rows make the next step stop to ask whether it may truncate a table it
      # is adding a constraint to. That prompt has no TTY to render into, so
      # the step died on it while npx still exited 0, and the whole run then
      # went ahead against a stale schema. Emptying first leaves nothing to ask
      # about.
      - name: Empty the throwaway test database
        run: |
          node --input-type=module -e '
            import { neon } from "@neondatabase/serverless";
            const sql = neon(process.env.DATABASE_URL);
            const rows = await sql`select tablename from pg_tables where schemaname = current_schema()`;
            if (!rows.length) { console.log("empty database, nothing to clear"); process.exit(0); }
            const list = rows.map((r) => `"${r.tablename}"`).join(", ");
            await sql.query(`TRUNCATE TABLE ${list} RESTART IDENTITY CASCADE`);
            console.log("cleared:", list);
          '

      # The suite has to own its schema. The `role` column was added to
      # schema.ts on 2026-09-05 and never pushed to the e2e database; the first
      # full CI run of this suite failed all 30 tests on
      # `column "role" does not exist`, months later. Pushing here means the
      # database can never drift behind the branch under test again.
      #
      # The explicit table check is the backstop: drizzle-kit has failed here
      # while npx still reported success, which is how a no-op push once passed
      # and left every test failing on a table that was never created.
      - name: Apply the schema to the test database
        run: |
          # < /dev/null so a prompt closes the stream and exits instead of
          # waiting on a TTY that will never arrive.
          npx drizzle-kit push --force < /dev/null || echo "::warning::drizzle-kit push did not succeed; falling back to the SQL migrations"
          # Additive migrations, applied whatever push did. Each is written
          # CREATE TABLE IF NOT EXISTS, so re-running one is a no-op.
          for file in src/lib/db/migrations/*.sql; do
            echo "applying $file"
            DATABASE_URL="$DATABASE_URL" node --input-type=module -e '
              import { neon } from "@neondatabase/serverless";
              import { readFileSync } from "node:fs";
              await neon(process.env.DATABASE_URL).query(readFileSync(process.argv[1], "utf8"));
            ' "$file"
          done
          node --input-type=module -e '
            import { neon } from "@neondatabase/serverless";
            const sql = neon(process.env.DATABASE_URL);
            const rows = await sql`select tablename from pg_tables where schemaname = current_schema()`;
            const have = new Set(rows.map((r) => r.tablename));
            const need = ["learners", "task_completions", "badges", "submissions", "skill_rungs", "opening_replies", "practice_attempts"];
            const missing = need.filter((t) => !have.has(t));
            if (missing.length) {
              console.error(`::error::Schema push left these tables missing: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log("schema applied:", [...have].sort().join(", "));
          '

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
